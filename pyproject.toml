[project]
name = "ragproductionapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sandhyatadi98", email = "sandhyatadi98@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.35.1",
    "openapi>=2.0.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ragproductionapp = "ragproductionapp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
